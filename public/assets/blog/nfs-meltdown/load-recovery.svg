<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <style>
    :root {
      --bg-color: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-primary: #111827;
      --text-secondary: #4B5563;
      --border-color: #E5E7EB;
      --grid-color: #F3F4F6;
      
      --bar-error: #EF4444;
      --bar-warning: #F59E0B;
      --bar-success: #10B981;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0B0F19;
        --card-bg: #111827;
        --text-primary: #F9FAFB;
        --text-secondary: #CBD5E1;
        --border-color: #374151;
        --grid-color: #1F2937;
        
        --bar-error: #F87171;
        --bar-warning: #FBBF24;
        --bar-success: #34D399;
      }
    }

    rect.bg { fill: var(--bg-color); }
    rect.card { fill: var(--card-bg); stroke: var(--border-color); stroke-width: 2; rx: 8; }
    
    text { font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { fill: var(--text-primary); font-size: 20px; font-weight: 600; text-anchor: middle; }
    .axis-label { fill: var(--text-secondary); font-size: 14px; text-anchor: middle; }
    .axis-label-right { fill: var(--text-secondary); font-size: 14px; text-anchor: end; }
    .value-label { fill: var(--text-primary); font-size: 14px; font-weight: 600; text-anchor: middle; }
    
    .grid-line { stroke: var(--grid-color); stroke-width: 1; }
    .axis-line { stroke: var(--border-color); stroke-width: 2; }
    
    .bar-error { fill: var(--bar-error); }
    .bar-warning { fill: var(--bar-warning); }
    .bar-success { fill: var(--bar-success); }
    
    .restart-label { font-size: 12px; font-weight: 600; fill: var(--bar-error); text-anchor: middle; }
  </style>

  <rect class="bg" width="800" height="420" />
  <rect class="card" x="20" y="20" width="760" height="380" />
  
  <text x="400" y="50" class="title">Load Average Recovery After NFS Restart</text>

  <!-- Y Axis Grid (Scale: 220 to 0 over 260px, from Y=80 to Y=340) -->
  <line x1="80" y1="80" x2="740" y2="80" class="grid-line" />
  <text x="70" y="85" class="axis-label-right">220</text>

  <line x1="80" y1="103.6" x2="740" y2="103.6" class="grid-line" />
  <text x="70" y="108.6" class="axis-label-right">200</text>
  
  <line x1="80" y1="162.7" x2="740" y2="162.7" class="grid-line" />
  <text x="70" y="167.7" class="axis-label-right">150</text>

  <line x1="80" y1="221.8" x2="740" y2="221.8" class="grid-line" />
  <text x="70" y="226.8" class="axis-label-right">100</text>
  
  <line x1="80" y1="280.9" x2="740" y2="280.9" class="grid-line" />
  <text x="70" y="285.9" class="axis-label-right">50</text>

  <line x1="80" y1="340" x2="740" y2="340" class="axis-line" />
  <text x="70" y="345" class="axis-label-right">0</text>

  <!-- Y-axis Title -->
  <text x="-210" y="30" transform="rotate(-90)" class="axis-label">Load Average</text>

  <!-- Bars (Width 46px) -->
  <g>
    <!-- Bar 1: 215 -->
    <rect class="bar-error" x="98" y="340" width="46" height="0" rx="4">
      <animate attributeName="y" from="340" to="86" dur="1s" begin="0s" fill="freeze" />
      <animate attributeName="height" from="0" to="254" dur="1s" begin="0s" fill="freeze" />
    </rect>
    <text x="121" y="78" class="value-label" opacity="0">
      215
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze" />
    </text>
    <text x="121" y="360" class="axis-label">18:10</text>

    <!-- Bar 2: 200 -->
    <rect class="bar-error" x="181" y="340" width="46" height="0" rx="4">
      <animate attributeName="y" from="340" to="104" dur="1s" begin="0.1s" fill="freeze" />
      <animate attributeName="height" from="0" to="236" dur="1s" begin="0.1s" fill="freeze" />
    </rect>
    <text x="204" y="96" class="value-label" opacity="0">
      200
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze" />
    </text>
    <text x="204" y="360" class="axis-label">18:12</text>

    <!-- Bar 3: 180 -->
    <rect class="bar-error" x="263" y="340" width="46" height="0" rx="4">
      <animate attributeName="y" from="340" to="127" dur="1s" begin="0.2s" fill="freeze" />
      <animate attributeName="height" from="0" to="213" dur="1s" begin="0.2s" fill="freeze" />
    </rect>
    <text x="286" y="119" class="value-label" opacity="0">
      180
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze" />
    </text>
    <text x="286" y="360" class="axis-label">18:14</text>

    <!-- Bar 4: 150 -->
    <rect class="bar-error" x="346" y="340" width="46" height="0" rx="4">
      <animate attributeName="y" from="340" to="163" dur="1s" begin="0.3s" fill="freeze" />
      <animate attributeName="height" from="0" to="177" dur="1s" begin="0.3s" fill="freeze" />
    </rect>
    <text x="369" y="155" class="value-label" opacity="0">
      150
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze" />
    </text>
    <text x="369" y="360" class="axis-label">18:16</text>
    <text x="369" y="375" class="restart-label">restart</text>

    <!-- Bar 5: 50 -->
    <rect class="bar-warning" x="428" y="340" width="46" height="0" rx="4">
      <animate attributeName="y" from="340" to="281" dur="1s" begin="0.4s" fill="freeze" />
      <animate attributeName="height" from="0" to="59" dur="1s" begin="0.4s" fill="freeze" />
    </rect>
    <text x="451" y="273" class="value-label" opacity="0">
      50
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze" />
    </text>
    <text x="451" y="360" class="axis-label">18:18</text>

    <!-- Bar 6: 8 -->
    <rect class="bar-success" x="511" y="340" width="46" height="0" rx="4">
      <animate attributeName="y" from="340" to="330" dur="1s" begin="0.5s" fill="freeze" />
      <animate attributeName="height" from="0" to="10" dur="1s" begin="0.5s" fill="freeze" />
    </rect>
    <text x="534" y="322" class="value-label" opacity="0">
      8
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze" />
    </text>
    <text x="534" y="360" class="axis-label">18:20</text>

    <!-- Bar 7: 6 -->
    <rect class="bar-success" x="593" y="340" width="46" height="0" rx="4">
      <animate attributeName="y" from="340" to="333" dur="1s" begin="0.6s" fill="freeze" />
      <animate attributeName="height" from="0" to="7" dur="1s" begin="0.6s" fill="freeze" />
    </rect>
    <text x="616" y="325" class="value-label" opacity="0">
      6
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze" />
    </text>
    <text x="616" y="360" class="axis-label">18:22</text>

    <!-- Bar 8: 5 -->
    <rect class="bar-success" x="676" y="340" width="46" height="0" rx="4">
      <animate attributeName="y" from="340" to="334" dur="1s" begin="0.7s" fill="freeze" />
      <animate attributeName="height" from="0" to="6" dur="1s" begin="0.7s" fill="freeze" />
    </rect>
    <text x="699" y="326" class="value-label" opacity="0">
      5
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze" />
    </text>
    <text x="699" y="360" class="axis-label">18:25</text>
  </g>
  
  <!-- Restart Event Line -->
  <line x1="392" y1="80" x2="392" y2="340" class="axis-line" stroke-dasharray="4 4" stroke="var(--bar-error)" opacity="0">
    <animate attributeName="opacity" from="0" to="0.5" dur="0.5s" begin="1.8s" fill="freeze" />
  </line>
</svg>
